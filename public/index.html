<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Patio – Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-logo"><img src="logo.png" alt="El Patio"> El Patio Comidas</div>
            <p class="auth-subtitle">Ingresá a tu cuenta para pedir</p>

            <div class="alert alert-error" id="alerta"></div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="tu@email.com">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="Tu contraseña">
            </div>

            <button class="btn btn-primary w-full" onclick="login()">Ingresar</button>

            <div class="form-footer">
                ¿No tenés cuenta? <a href="register.html">Registrate</a>
            </div>
        </div>
    </div>

    <script>
        // Si ya está logueado, redirigir
        const token = localStorage.getItem('token');
        const usuario = JSON.parse(localStorage.getItem('usuario') || 'null');
        if (token && usuario) {
            window.location.href = usuario.rol === 'admin' ? 'admin.html' : 'menu.html';
        }

        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const alerta = document.getElementById('alerta');
            alerta.classList.remove('show');

            if (!email || !password) {
                alerta.textContent = 'Completá todos los campos.';
                alerta.classList.add('show');
                return;
            }

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (!res.ok) {
                    alerta.textContent = data.error || 'Error al ingresar.';
                    alerta.classList.add('show');
                    return;
                }

                localStorage.setItem('token', data.token);
                localStorage.setItem('usuario', JSON.stringify(data.usuario));

                // Redirigir según rol
                window.location.href = data.usuario.rol === 'admin' ? 'admin.html' : 'menu.html';

            } catch (err) {
                alerta.textContent = 'Error de conexión con el servidor.';
                alerta.classList.add('show');
            }
        }

        // Permitir login con Enter
        document.addEventListener('keypress', e => {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
